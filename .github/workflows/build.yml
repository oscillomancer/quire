# Build and test on demand, never on ordinary branch pushes.
# Once on the default branch: gh workflow run build.yml --ref <branch> -f platforms=macos
# Before integration: git tag -a ci/<branch>-<n> -m 'platforms=macos'
#                    git push origin <branch> refs/tags/ci/<branch>-<n>
# Omit the annotation (or use platforms=all) to run all three platforms.
# Delete the remote tag after the run: git push origin :refs/tags/ci/<branch>-<n>
# Linux runs the full dev preset; macOS arm64 and Windows clang-cl run all
# currently portable targets/tests. Port gates are listed in CONTRIBUTING.md.
name: Build and test

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build and test
        type: choice
        options: [linux, macos, windows, all]
        default: all
  push:
    tags: ['ci/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CTEST_OUTPUT_ON_FAILURE: '1'
  CMAKE_BUILD_PARALLEL_LEVEL: '6'
  SUPPLE_REQUIRE_OFFSCREEN: '1'

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      branch: ${{ steps.plan.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          INPUT_PLATFORMS: ${{ inputs.platforms }}
        run: |
          platforms=${INPUT_PLATFORMS:-all}
          branch=$GITHUB_REF_NAME
          if [[ $GITHUB_REF == refs/tags/ci/* ]]; then
            branch=${GITHUB_REF_NAME#ci/}
            branch=${branch%-*}
            # checkout can replace annotated refs with the event's commit SHA.
            git fetch --force origin "$GITHUB_REF:$GITHUB_REF"
            choice=$(git for-each-ref --format='%(contents:subject)' "$GITHUB_REF")
            if [[ $choice == platforms=* ]]; then platforms=${choice#platforms=}; fi
          fi
          case "$platforms" in linux|macos|windows|all) ;; *) echo "Invalid platforms: $platforms"; exit 1 ;; esac
          matrix=$(jq -cn --arg choice "$platforms" '{include: [
            {platform:"linux", runner:"ubuntu-24.04", preset:"dev"},
            {platform:"macos", runner:"macos-15", preset:"macos"},
            {platform:"windows", runner:"windows-2022", preset:"windows"}
          ] | map(select($choice == "all" or .platform == $choice))}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    name: ${{ matrix.platform }} (${{ matrix.preset }})
    runs-on: ${{ matrix.runner }}
    # Native source-export conformance builds all thirteen projects serially.
    # Leave room for those tests without increasing compiler concurrency.
    timeout-minutes: ${{ matrix.platform == 'macos' && 150 || matrix.platform == 'windows' && 120 || 60 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # Different ci/<branch>-<n> tags still cancel superseded platform builds.
    concurrency:
      group: build-${{ needs.plan.outputs.branch }}-${{ matrix.platform }}
      cancel-in-progress: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Cache dependencies
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/scripts/*', 'tools/validator/build.sh', 'vcpkg.json') }}

      # System packages below belong to disposable runners, never the workstation.
      - name: Linux tools and libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ninja-build ccache libx11-dev libxcursor-dev libxrandr-dev libxext-dev \
            libgl1-mesa-dev libegl1-mesa-dev zlib1g-dev \
            libasound2-dev libwayland-dev libxkbcommon-dev xvfb xauth
          wget -q https://apt.llvm.org/llvm.sh -O "$RUNNER_TEMP/llvm.sh"
          sudo bash "$RUNNER_TEMP/llvm.sh" 22
          echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"
          .github/scripts/sdl3.sh
          echo "CMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/.deps/install" >> "$GITHUB_ENV"
          # Match local dev coverage, including the optional external validator.
          export XDG_CACHE_HOME="$GITHUB_WORKSPACE/.deps/cache"
          validator=$(tools/validator/build.sh)
          echo "CLAP_VALIDATOR_BIN=$validator" >> "$GITHUB_ENV"

      # AppleClang/system libc++; shared MIT fast_float supplies float parsing.
      # SDK zlib, arm64, macOS 14.4. No bundled C++ runtime is required.
      - name: macOS tools and libraries
        if: matrix.platform == 'macos'
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_CACHE="$GITHUB_WORKSPACE/.deps/homebrew"
          # Link backups belong to the previous runner, unlike bottle downloads.
          rm -rf "$HOMEBREW_CACHE/Backup"
          brew install ninja sdl3 ccache
          test "$(uname -m)" = arm64
          xcrun clang --version
          # The pinned clap-validator, as on Linux (the runner has cargo).
          export XDG_CACHE_HOME="$GITHUB_WORKSPACE/.deps/cache"
          validator=$(tools/validator/build.sh)
          echo "CLAP_VALIDATOR_BIN=$validator" >> "$GITHUB_ENV"

      # Ninja/clang-cl still need the Windows SDK and link.exe environment.
      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.platform == 'windows'
      - name: Windows dependencies (vcpkg binary cache)
        if: matrix.platform == 'windows'
        run: |
          mkdir -p .deps/vcpkg-binaries
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          echo "VCPKG_BINARY_SOURCES=clear;files,$(cygpath -m "$GITHUB_WORKSPACE/.deps/vcpkg-binaries"),readwrite" >> "$GITHUB_ENV"
          clang-cl --version
          # The pinned clap-validator, as on Linux (the runner has cargo).
          export XDG_CACHE_HOME="$GITHUB_WORKSPACE/.deps/cache"
          validator=$(tools/validator/build.sh)
          echo "CLAP_VALIDATOR_BIN=$validator" >> "$GITHUB_ENV"

      # Shared core libraries are compiled in several isolated plugin builds.
      - name: Restore Linux compiler cache
        if: matrix.platform == 'linux'
        id: compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: .compiler-cache
          key: clang22-${{ runner.arch }}-${{ github.sha }}
          restore-keys: clang22-${{ runner.arch }}-
      - name: Restore macOS compiler cache
        if: matrix.platform == 'macos'
        id: macos-compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: .compiler-cache
          key: appleclang-${{ runner.arch }}-${{ github.sha }}
          restore-keys: appleclang-${{ runner.arch }}-
      - name: Configure
        run: |
          if [[ '${{ matrix.platform }}' == linux ]]; then
            echo "CCACHE_DIR=$GITHUB_WORKSPACE/.compiler-cache" >> "$GITHUB_ENV"
            echo "CCACHE_NOHASHDIR=true" >> "$GITHUB_ENV"
            # Export tests configure fresh child projects; CMake reads these
            # defaults even when the exported project's command has no flags.
            echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
            echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
            echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"
            cmake --preset dev -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          elif [[ '${{ matrix.platform }}' == macos ]]; then
            echo "CCACHE_DIR=$GITHUB_WORKSPACE/.compiler-cache" >> "$GITHUB_ENV"
            echo "CCACHE_NOHASHDIR=true" >> "$GITHUB_ENV"
            # Export tests configure fresh child projects; CMake reads these
            # defaults even when the exported project's command has no flags.
            echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
            echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
            echo "CCACHE_MAXSIZE=1G" >> "$GITHUB_ENV"
            cmake --preset macos -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          else
            cmake --preset ${{ matrix.preset }}
          fi
      # Preserve expensive dependencies even when the compiler/test stage fails.
      - name: Save dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .deps
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Build
        # Align the environment and explicit CLI limit for predictable
        # compiler concurrency on every runner.
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: ${{ matrix.platform == 'macos' && '2' || '6' }}
        run: |
          build_log="$RUNNER_TEMP/native-build.log"
          if cmake --build --preset ${{ matrix.preset }} --parallel "$CMAKE_BUILD_PARALLEL_LEVEL" -- -k 0 2>&1 | tee "$build_log"; then
            :
          elif [[ '${{ matrix.platform }}' == windows ]] && tr -d '\000' < "$build_log" | grep -F 'The process cannot access the file because it is being used by another process.' > /dev/null; then
            # Temporary scanner/file locks can race manifest embedding. Ninja
            # has finished the other targets; retry only its unfinished work.
            sleep 1
            cmake --build --preset ${{ matrix.preset }} --parallel "$CMAKE_BUILD_PARALLEL_LEVEL" -- -k 0
          else
            exit 1
          fi
      - name: Test Linux (software OpenGL under Xvfb)
        if: matrix.platform == 'linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          TMPDIR: /tmp
          SUPPLE_PICTURE_OUTPUT_DIR: ${{ github.workspace }}/build/${{ matrix.preset }}/pictures
        run: xvfb-run -a -s '-screen 0 1920x1080x24' ctest --preset dev
      # The runner's desktop is 1024x768, smaller than the stock editors and
      # the 1320x840 the probes resize them to; win32-embedding can only see
      # what is on screen.
      - name: Windows display resolution
        if: matrix.platform == 'windows'
        continue-on-error: true
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Windows software OpenGL for GUI tests
        if: matrix.platform == 'windows'
        run: bash .github/scripts/gui-mesa-windows.sh
      - name: Test portable targets
        if: matrix.platform != 'linux'
        env:
          SUPPLE_PICTURE_OUTPUT_DIR: ${{ github.workspace }}/build/${{ matrix.preset }}/pictures
        run: ctest --preset ${{ matrix.preset }}
      - name: Save Linux compiler cache
        if: always() && matrix.platform == 'linux' && steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .compiler-cache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Save macOS compiler cache
        if: always() && matrix.platform == 'macos' && steps.macos-compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .compiler-cache
          key: ${{ steps.macos-compiler-cache.outputs.cache-primary-key }}
      - name: Test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.platform }}
          path: build/${{ matrix.preset }}/Testing/Temporary/
          if-no-files-found: ignore
      - name: GUI smoke images
        if: always() && matrix.platform != 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: gui-smoke-${{ matrix.platform }}
          path: build/${{ matrix.preset }}/daw/gui/*.png
          if-no-files-found: ignore

      - name: DSP editor pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsp-pictures-${{ matrix.platform }}
          path: build/${{ matrix.preset }}/pictures/*.png
          if-no-files-found: ignore
